<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Shape Maker &middot; make a thing and print it</title>
<meta name="description" content="A 3D modelling toy for kids. Tap a shape, drag it, stack it, download it as an STL and print it.">

<!-- Link preview. og.png is generated by tools/make-og.sh in the
     ichabod-crane-net repo, so every app under the domain shares one card
     design. The width and height are what decide whether a scraper draws a
     large preview or a grey one-line link, so they are not optional. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://cad.ichabod-crane.net/">
<meta property="og:site_name" content="Ichabod Crane">
<meta property="og:title" content="Shape Maker">
<meta property="og:description" content="A 3D modelling toy for kids. Tap a shape, stack it, print the STL.">
<meta property="og:image" content="https://cad.ichabod-crane.net/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="A jack-o'-lantern beside the words Shape Maker: a 3D modelling toy for kids.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shape Maker">
<meta name="twitter:description" content="A 3D modelling toy for kids. Tap a shape, stack it, print the STL.">
<meta name="twitter:image" content="https://cad.ichabod-crane.net/og.png">
<meta name="twitter:image:alt" content="A jack-o'-lantern beside the words Shape Maker: a 3D modelling toy for kids.">
<link rel="canonical" href="https://cad.ichabod-crane.net/">

<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
</head>
<body>

<div id="app">

  <header id="topbar">
    <h1 id="brand">Shape Maker</h1>
    <p id="hint" aria-live="polite">Tap a shape below to start</p>
    <div id="topactions">
      <button id="btn-undo" class="tool tool-undo" type="button" disabled data-tour="undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H15a5 5 0 0 1 0 10H8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3.5 8 7l4 3.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Undo</span>
      </button>
      <button id="btn-download" class="tool tool-download" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M7.5 10.5 12 15l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 18.5h15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span>Save</span>
      </button>
    </div>
  </header>

  <main id="stage">
    <canvas id="scene" data-tour="orbit" tabindex="0" aria-label="3D model inspection area" aria-describedby="scene-keys"></canvas>
    <p id="scene-keys" class="sr-only">Use left and right bracket to select shapes. Use arrow keys to rotate the view. Press Home to reset the view.</p>
  </main>

  <footer id="bottombar">

    <div id="palette" role="group" aria-label="Add a shape">
      <button class="shape" type="button" data-kind="cube" data-tour="create">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 34 12v16L20 35 6 28V12Z" fill="#ff6b6b"/><path d="M20 5 34 12 20 19 6 12Z" fill="#ff9a9a"/><path d="M20 19v16L6 28V12Z" fill="#d94a4a"/></svg>
        <span>Block</span>
      </button>
      <button class="shape" type="button" data-kind="ball">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#4dabf7"/><circle cx="15" cy="14" r="5" fill="#a5d8ff"/></svg>
        <span>Ball</span>
      </button>
      <button class="shape" type="button" data-kind="tube">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 11h26v18a13 5.5 0 0 1-26 0Z" fill="#51cf66"/><ellipse cx="20" cy="11" rx="13" ry="5.5" fill="#8ce99a"/></svg>
        <span>Tube</span>
      </button>
      <button class="shape" type="button" data-kind="cone">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 33 30H7Z" fill="#ffd43b"/><ellipse cx="20" cy="30" rx="13" ry="5.5" fill="#ffe98a"/></svg>
        <span>Cone</span>
      </button>
    </div>

    <!-- Mirror is a toggle, so it is the one button on the page that stays
         pressed. aria-pressed carries that state and the CSS reads the same
         attribute, so there is one source of truth for "is it on". -->
    <div id="symmetry" role="group" aria-label="Mirror new shapes">
      <button id="btn-mirror" class="tool tool-mirror" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 3.1"/><path d="M9.2 5.5 3.5 12l5.7 6.5Z" fill="currentColor"/><path d="M14.8 5.5 20.5 12l-5.7 6.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
        <span>Mirror</span>
      </button>
    </div>

    <div id="edit" role="group" aria-label="Change the chosen shape">
      <button id="btn-bigger" class="tool" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <span>Bigger</span>
      </button>
      <button id="btn-smaller" class="tool" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <span>Smaller</span>
      </button>
      <button id="btn-up" class="tool" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M6.5 11.5 12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Up</span>
      </button>
      <button id="btn-down" class="tool" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M6.5 12.5 12 18l5.5-5.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Down</span>
      </button>
      <button id="btn-delete" class="tool tool-delete" type="button" disabled data-tour="delete">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M9 7V5h6v2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 7 7.6 19h8.8L17.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Delete</span>
      </button>
    </div>

    <a id="backlink" href="https://ichabod-crane.net/">
      <span aria-hidden="true">&#8592;</span> Built by Ichabod &middot; ichabod-crane.net
    </a>

  </footer>

  <aside id="tour" aria-labelledby="tour-title" aria-live="polite" hidden>
    <p id="tour-count"></p>
    <h2 id="tour-title"></h2>
    <p id="tour-copy"></p>
    <div id="tour-actions">
      <button id="tour-skip" type="button">Skip</button>
      <button id="tour-next" type="button">Next</button>
    </div>
  </aside>

</div>

<noscript>
  <p class="noscript">Shape Maker needs JavaScript switched on — the whole thing runs in your browser, and there is no server to fall back to.</p>
</noscript>

<script type="module" src="app.js"></script>
</body>
</html>
