server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # Traefik terminates TLS; these are the headers worth setting anyway.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # three.js is vendored and versioned by its directory name, so it can be
    # cached hard. The app itself is not: a change to app.js has to reach the
    # kid on the next reload, because "refresh it" is the only support channel.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
